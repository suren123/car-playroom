name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:rules
      - run: npm run check:assets
      - run: npm run test:records
      - run: npx tsc --noEmit
      - run: npm run build
